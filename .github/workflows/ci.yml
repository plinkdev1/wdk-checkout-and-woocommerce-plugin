name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  php-lint:
    name: PHP lint (plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Lint all plugin PHP
        run: find woocommerce-plugin -name '*.php' -print0 | xargs -0 -n1 php -l

  widget:
    name: Checkout widget (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wdk-checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Ensure the built widget asset is in sync
        run: git diff --exit-code ../../woocommerce-plugin/wdk-pay/assets/js/wdk-checkout.js
