# Publishes the WDK Pay packages to npm:
#   @wdk-starter/wdk-payment-verifier  (packages/wdk-payment-verifier)
#   @wdk-starter/wdk-checkout          (packages/wdk-checkout)
#
# ── One-time setup (npm 2FA) ────────────────────────────────────────────────
# Git pushes/PRs do NOT publish to npm — only this workflow does, on a Release.
# Because your npm account has 2FA, CI must use an *automation token*:
#   1. npmjs.com → Access Tokens → Generate New Token → "Automation"
#      (bypasses the 2FA OTP prompt that would otherwise block CI).
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret → name: NPM_TOKEN.
#   3. If the @wdk-starter org enforces 2FA, set it to "Require two-factor
#      authentication or automation tokens" so the token is accepted.
#
# ── Releasing ───────────────────────────────────────────────────────────────
# Bump the "version" of whichever package(s) changed, commit, then publish a
# GitHub Release (or run manually). Each package only re-publishes if its
# version is new (npm rejects duplicates) — so the unchanged package's step
# will simply fail-noisily on a duplicate version; bump only what you ship.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish @wdk-starter/wdk-payment-verifier
        working-directory: packages/wdk-payment-verifier
        run: npm install && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @wdk-starter/wdk-checkout
        working-directory: packages/wdk-checkout
        run: npm install && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
